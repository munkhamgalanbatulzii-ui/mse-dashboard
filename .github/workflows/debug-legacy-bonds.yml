name: Debug legacy MSE bonds

on:
  push:
    paths:
      - "scripts/debug_legacy_bonds.py"
      - ".github/workflows/debug-legacy-bonds.yml"
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/debug_legacy_bonds.py
