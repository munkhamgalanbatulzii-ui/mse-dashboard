name: Update MSE Dashboard

on:
  schedule:
    # 17:40 Ulaanbaatar = 09:40 UTC
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mse-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Update dashboard data from MSE
        run: python scripts/update_mse.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data.json; then
            echo "No dashboard data changes."
            exit 0
          fi
          git config user.name "mse-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "chore: update MSE dashboard data"
          git pull --rebase origin main
          git push

      - name: Send Outlook daily email
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          OUTLOOK_SENDER: ${{ secrets.OUTLOOK_SENDER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/send_outlook_email.py
